apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: 'https://github.com/text-adi/k8s-cluster-infrastructure.git'
        revision: HEAD
        directories:
          - path: 'apps/*' # Сканує кожен підкаталог у папці apps
  template:
    metadata:
      name: '{{ `{{ .path.basename }}` }}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: 'https://github.com/text-adi/k8s-cluster-infrastructure.git'
        targetRevision: HEAD
        path: '{{ `{{ .path.path }}` }}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{ `{{ .path.basename }}` }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true