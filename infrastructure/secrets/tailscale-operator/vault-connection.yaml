apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: tailscale
spec:
  # Default service name/namespace for the HashiCorp vault Helm chart
  # deployed standalone (infrastructure/charts/vault) in the "vault" namespace.
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: true