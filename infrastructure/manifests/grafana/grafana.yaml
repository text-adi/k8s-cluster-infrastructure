apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  ingress:
    spec:
      ingressClassName: tailscale
      tls:
        - hosts:
            - grafana
    metadata:
      annotations:
        tailscale.com/proxy-group: ingress-ha
  deployment:
    spec:
      template:
        spec:
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      resources:
        requests:
          storage: 250Mi
      accessModes:
        - ReadWriteOnce