apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: smart-tool
  namespace: grafana
spec:
  template:
    spec:
      annotations:
        - kind: AnnotationQuery
          spec:
            builtIn: true
            enable: true
            hide: true
            iconColor: rgba(0, 211, 255, 1)
            name: Annotations & Alerts
            query:
              datasource:
                name: '-- Grafana --'
              group: grafana
              kind: DataQuery
              spec: { }
              version: v0
      cursorSync: 'Off'
      editable: true
      elements:
        panel-1:
          kind: Panel
          spec:
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      hidden: false
                      query:
                        datasource:
                          name: f0bf783e-3b77-4ae6-a56a-e90f8cb1103e
                        group: prometheus
                        kind: DataQuery
                        spec:
                          editorMode: builder
                          expr: battery_percent
                          legendFormat: __auto
                          range: true
                        version: v0
                      refId: A
                queryOptions: { }
                transformations: [ ]
            description: ''
            id: 1
            links: [ ]
            title: New panel
            vizConfig:
              group: timeseries
              kind: VizConfig
              spec:
                fieldConfig:
                  defaults:
                    color:
                      mode: palette-classic
                    custom:
                      axisBorderShow: false
                      axisCenteredZero: false
                      axisColorMode: text
                      axisLabel: ''
                      axisPlacement: auto
                      barAlignment: 0
                      barWidthFactor: 0.6
                      drawStyle: line
                      fillOpacity: 25
                      gradientMode: none
                      hideFrom:
                        legend: false
                        tooltip: false
                        viz: false
                      insertNulls: false
                      lineInterpolation: linear
                      lineWidth: 1
                      pointSize: 5
                      scaleDistribution:
                        type: linear
                      showPoints: auto
                      showValues: false
                      spanNulls: false
                      stacking:
                        group: A
                        mode: none
                      thresholdsStyle:
                        mode: 'off'
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: 0
                        - color: red
                          value: 80
                  overrides: [ ]
                options:
                  annotations:
                    clustering: -1
                    multiLane: false
                  legend:
                    calcs: [ ]
                    displayMode: list
                    enableFacetedFilter: false
                    overflow: ellipsis
                    placement: bottom
                    showLegend: false
                  tooltip:
                    hideZeros: false
                    mode: single
                    sort: none
              version: 13.1.3
        panel-2:
          kind: Panel
          spec:
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      hidden: false
                      query:
                        datasource:
                          name: f0bf783e-3b77-4ae6-a56a-e90f8cb1103e
                        group: prometheus
                        kind: DataQuery
                        spec:
                          editorMode: builder
                          exemplar: false
                          expr: battery_percent
                          instant: true
                          legendFormat: __auto
                          range: false
                        version: v0
                      refId: A
                queryOptions: { }
                transformations: [ ]
            description: ''
            id: 2
            links: [ ]
            title: New panel
            vizConfig:
              group: gauge
              kind: VizConfig
              spec:
                fieldConfig:
                  defaults:
                    color:
                      mode: thresholds
                    thresholds:
                      mode: absolute
                      steps:
                        - color: red
                          value: 0
                        - color: '#EAB839'
                          value: 15
                        - color: green
                          value: 20
                    unit: percent
                  overrides: [ ]
                options:
                  barShape: flat
                  barWidthFactor: 0.54
                  effects:
                    barGlow: false
                    centerGlow: false
                    gradient: false
                  endpointMarker: point
                  minVizHeight: 75
                  minVizWidth: 75
                  orientation: auto
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ''
                    values: false
                  segmentCount: 63
                  segmentSpacing: 0.3
                  shape: gauge
                  showThresholdLabels: false
                  showThresholdMarkers: true
                  sizing: auto
                  sparkline: true
                  textMode: auto
              version: 13.1.3
        panel-3:
          kind: Panel
          spec:
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      hidden: false
                      query:
                        datasource:
                          name: f0bf783e-3b77-4ae6-a56a-e90f8cb1103e
                        group: prometheus
                        kind: DataQuery
                        spec:
                          editorMode: builder
                          exemplar: false
                          expr: humidity
                          instant: false
                          legendFormat: __auto
                          range: true
                        version: v0
                      refId: A
                queryOptions: { }
                transformations: [ ]
            description: ''
            id: 3
            links: [ ]
            title: Humidity
            vizConfig:
              group: timeseries
              kind: VizConfig
              spec:
                fieldConfig:
                  defaults:
                    color:
                      mode: palette-classic
                    custom:
                      axisBorderShow: false
                      axisCenteredZero: false
                      axisColorMode: text
                      axisLabel: ''
                      axisPlacement: auto
                      barAlignment: 0
                      barWidthFactor: 0.6
                      drawStyle: line
                      fillOpacity: 25
                      gradientMode: none
                      hideFrom:
                        legend: false
                        tooltip: false
                        viz: false
                      insertNulls: false
                      lineInterpolation: smooth
                      lineWidth: 1
                      pointSize: 5
                      scaleDistribution:
                        type: linear
                      showPoints: auto
                      showValues: false
                      spanNulls: false
                      stacking:
                        group: A
                        mode: none
                      thresholdsStyle:
                        mode: 'off'
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: 0
                        - color: red
                          value: 80
                    unit: humidity
                  overrides: [ ]
                options:
                  annotations:
                    clustering: -1
                    multiLane: false
                  legend:
                    calcs: [ ]
                    displayMode: list
                    enableFacetedFilter: false
                    overflow: ellipsis
                    placement: bottom
                    showLegend: false
                  tooltip:
                    hideZeros: false
                    mode: single
                    sort: none
              version: 13.1.3
        panel-4:
          kind: Panel
          spec:
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      hidden: false
                      query:
                        datasource:
                          name: f0bf783e-3b77-4ae6-a56a-e90f8cb1103e
                        group: prometheus
                        kind: DataQuery
                        spec:
                          editorMode: builder
                          exemplar: false
                          expr: temperature_raw * 0.1
                          instant: false
                          interval: ''
                          legendFormat: __auto
                          range: true
                        version: v0
                      refId: A
                queryOptions: { }
                transformations: [ ]
            description: ''
            id: 4
            links: [ ]
            title: Temperature
            vizConfig:
              group: timeseries
              kind: VizConfig
              spec:
                fieldConfig:
                  defaults:
                    color:
                      mode: palette-classic
                    custom:
                      axisBorderShow: false
                      axisCenteredZero: false
                      axisColorMode: text
                      axisLabel: ''
                      axisPlacement: auto
                      barAlignment: 0
                      barWidthFactor: 0.6
                      drawStyle: line
                      fillOpacity: 20
                      gradientMode: none
                      hideFrom:
                        legend: false
                        tooltip: false
                        viz: false
                      insertNulls: false
                      lineInterpolation: smooth
                      lineStyle:
                        fill: solid
                      lineWidth: 1
                      pointSize: 5
                      scaleDistribution:
                        type: linear
                      showPoints: auto
                      showValues: false
                      spanNulls: false
                      stacking:
                        group: A
                        mode: none
                      thresholdsStyle:
                        mode: 'off'
                    fieldMinMax: false
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: 0
                    unit: celsius
                  overrides: [ ]
                options:
                  annotations:
                    clustering: -1
                    multiLane: false
                  legend:
                    calcs: [ ]
                    displayMode: list
                    enableFacetedFilter: false
                    overflow: ellipsis
                    placement: bottom
                    showLegend: false
                  tooltip:
                    hideZeros: false
                    mode: single
                    sort: none
              version: 13.1.3
        panel-5:
          kind: Panel
          spec:
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      hidden: false
                      query:
                        datasource:
                          name: f0bf783e-3b77-4ae6-a56a-e90f8cb1103e
                        group: prometheus
                        kind: DataQuery
                        spec:
                          editorMode: builder
                          exemplar: false
                          expr: temperature_raw * 0.1
                          instant: true
                          interval: ''
                          legendFormat: __auto
                          range: false
                        version: v0
                      refId: A
                queryOptions: { }
                transformations: [ ]
            description: ''
            id: 5
            links: [ ]
            title: Temperature
            vizConfig:
              group: stat
              kind: VizConfig
              spec:
                fieldConfig:
                  defaults:
                    color:
                      mode: thresholds
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: 0
                    unit: celsius
                  overrides: [ ]
                options:
                  colorMode: background
                  graphMode: none
                  justifyMode: auto
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ''
                    values: false
                  showPercentChange: false
                  textMode: auto
                  wideLayout: true
              version: 13.1.3
        panel-6:
          kind: Panel
          spec:
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      hidden: false
                      query:
                        datasource:
                          name: f0bf783e-3b77-4ae6-a56a-e90f8cb1103e
                        group: prometheus
                        kind: DataQuery
                        spec:
                          editorMode: builder
                          exemplar: false
                          expr: humidity
                          instant: true
                          legendFormat: __auto
                          range: false
                        version: v0
                      refId: A
                queryOptions: { }
                transformations: [ ]
            description: ''
            id: 6
            links: [ ]
            title: Humidity
            vizConfig:
              group: stat
              kind: VizConfig
              spec:
                fieldConfig:
                  defaults:
                    color:
                      mode: thresholds
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: 0
                        - color: red
                          value: 80
                    unit: humidity
                  overrides: [ ]
                options:
                  colorMode: background
                  graphMode: none
                  justifyMode: auto
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ''
                    values: false
                  showPercentChange: false
                  textMode: auto
                  wideLayout: true
              version: 13.1.3
      layout:
        kind: TabsLayout
        spec:
          tabs:
            - kind: TabsLayoutTab
              spec:
                layout:
                  kind: AutoGridLayout
                  spec:
                    columnWidthMode: standard
                    items:
                      - kind: AutoGridLayoutItem
                        spec:
                          element:
                            kind: ElementReference
                            name: panel-4
                      - kind: AutoGridLayoutItem
                        spec:
                          element:
                            kind: ElementReference
                            name: panel-5
                      - kind: AutoGridLayoutItem
                        spec:
                          element:
                            kind: ElementReference
                            name: panel-3
                      - kind: AutoGridLayoutItem
                        spec:
                          element:
                            kind: ElementReference
                            name: panel-6
                    maxColumnCount: 2
                    rowHeightMode: standard
                title: Temperature and Humidity
            - kind: TabsLayoutTab
              spec:
                layout:
                  kind: AutoGridLayout
                  spec:
                    columnWidthMode: standard
                    items:
                      - kind: AutoGridLayoutItem
                        spec:
                          element:
                            kind: ElementReference
                            name: panel-1
                      - kind: AutoGridLayoutItem
                        spec:
                          element:
                            kind: ElementReference
                            name: panel-2
                    maxColumnCount: 3
                    rowHeightMode: standard
                title: Battery
      links: [ ]
      liveNow: false
      preload: false
      tags: [ ]
      timeSettings:
        autoRefresh: ''
        autoRefreshIntervals:
          - 5s
          - 10s
          - 30s
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 1d
        fiscalYearStartMonth: 0
        from: now-24h
        hideTimepicker: false
        timezone: browser
        to: now
      title: SmartTools
      variables: [ ]
