apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  vaultAuthRef: tailscale-operator
  mount: secret
  type: kv-v2
  # Vault KV entry must contain exactly the keys client_id and client_secret,
  # e.g.: vault kv put secret/tailscale-operator/oauth client_id=... client_secret=...
  path: tailscale-operator/oauth
  refreshAfter: 1h
  destination:
    create: true
    name: operator-oauth