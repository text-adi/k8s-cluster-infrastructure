apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: victoria-storage
  namespace: monitoring
spec:
  retentionPeriod: "30d"

  storage:
    resources:
      requests:
        storage: 20Gi
  volumes:
    - name: fix-indexdb-script
      configMap:
        name: vmsingle-fix-indexdb
        defaultMode: 0o555
  initContainers:
    - name: fix-corrupted-indexdb
      image: python:3.12-alpine
      command:
        - sh
        - -c
        - "apk add --no-cache zstd >/dev/null 2>&1 || echo '[warn] could not install zstd, deep index.bin check will be skipped'; python3 /scripts/fix-indexdb.py /victoria-metrics-data"
      volumeMounts:
        - name: data
          mountPath: /victoria-metrics-data
        - name: fix-indexdb-script
          mountPath: /scripts