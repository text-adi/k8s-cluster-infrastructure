---
vector:
  role: "Agent"

  tolerations:
    - operator: "Exists"
  priorityClassName: "platform-critical"


  terminationGracePeriodSeconds: 90

  podMonitor:
    enabled: true

  extraVolumes:
    - name: data-dir
      hostPath:
        path: /var/lib/vector-agent
        type: DirectoryOrCreate

  extraVolumeMounts:
    - name: data-dir
      mountPath: /vector-data-dir

  customConfig:
    data_dir: /vector-data-dir
    api:
      enabled: true
      address: 0.0.0.0:8686
    sources:
      kubernetes_logs:
        type: kubernetes_logs
      host_metrics:
        filesystem:
          devices:
            excludes: [binfmt_misc]
          filesystems:
            excludes: [binfmt_misc]
          mountpoints:
            excludes: ["*/proc/sys/fs/binfmt_misc"]
        type: host_metrics
      internal_metrics:
        type: internal_metrics
    sinks:
      prom_exporter:
        type: prometheus_exporter
        inputs: [host_metrics, internal_metrics]
        address: 0.0.0.0:9090
      aggregator:
        type: http
        inputs: [kubernetes_logs]
        uri: "http://vector-aggregator.elasticsearch.svc:6000/"
        method: post
        framing:
          method: newline_delimited
        encoding:
          codec: json
        buffer:
          type: disk
          max_size: 268435456
          when_full: block


vector-aggregator:
  role: "Aggregator"

  terminationGracePeriodSeconds: 150

  fullnameOverride: "vector-aggregator"

  priorityClassName: "platform-critical"

  podMonitor:
    enabled: true

  persistence:
    enabled: true
    size: 5Gi

  # Mounts the CA cert that ECK generates for the Elasticsearch HTTP service,
  # so Vector can verify the TLS certificate when shipping logs.
  extraVolumes:
    - name: es-certs
      secret:
        secretName: elasticsearch-es-http-certs-public

  extraVolumeMounts:
    - name: es-certs
      mountPath: /etc/vector/es-certs
      readOnly: true

  # Credentials for the auto-generated "elastic" user, created by ECK in the
  # same namespace as the Elasticsearch resource.
  env:
    # Since Vector 0.57.0, ${VAR} interpolation in vector.yaml is disabled
    # by default and must be explicitly opted into.
    - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
      value: "true"
    - name: ELASTICSEARCH_USERNAME
      value: "elastic"
    - name: ELASTICSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-es-elastic-user
          key: elastic

  customConfig:
    data_dir: /vector-data-dir
    api:
      enabled: true
      address: 0.0.0.0:8686
    sources:
      vector_agents:
        type: http_server
        address: 0.0.0.0:6000
        framing:
          method: newline_delimited
        decoding:
          codec: json
      internal_metrics:
        type: internal_metrics
    sinks:
      prom_exporter:
        type: prometheus_exporter
        inputs: [internal_metrics]
        address: 0.0.0.0:9090
      elasticsearch:
        type: elasticsearch
        inputs: [vector_agents]
        endpoints:
          - "https://elasticsearch-es-http.elasticsearch.svc:9200"
        mode: data_stream
        data_stream:
          # <type>-<dataset>-<namespace>
          type: logs
          dataset: vector
          namespace: default
        auth:
          strategy: basic
          user: "${ELASTICSEARCH_USERNAME}"
          password: "${ELASTICSEARCH_PASSWORD}"
        tls:
          ca_file: /etc/vector/es-certs/ca.crt
        compression: gzip
        batch:
          max_bytes: 5000000
        request:
          timeout_secs: 90
        buffer:
          type: disk
          max_size: 536870912
          when_full: block