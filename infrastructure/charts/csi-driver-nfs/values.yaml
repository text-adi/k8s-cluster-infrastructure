---
csi-driver-nfs:
  controller:
    replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: csi-nfs-controller
  storageClass:
    - name: nfs-delete
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      parameters:
        server: 10.0.43.104
        share: /
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      mountOptions:
        - nfsvers=4.1
    - name: nfs-retain
      parameters:
        server: 10.0.43.104
        share: /data
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      mountOptions:
        - nfsvers=4.1
