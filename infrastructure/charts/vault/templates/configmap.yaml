apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-init-script
  namespace: {{ .Release.Namespace }}
data:
  unseal.sh: |
    #!/bin/sh
    echo "Vault unseal watcher started."

    # Runs for the lifetime of the sidecar container (not a lifecycle hook),
    # so it can safely wait out however long Vault takes to be initialized
    # and keeps re-checking after every future restart/reseal.
    # VAULT_UNSEAL_KEY is injected from a Secret created out-of-band and
    # never committed to git.
    while true; do
      STATUS=$(vault status -format=json 2>/dev/null)

      if echo "$STATUS" | grep -q '"initialized": *true' && echo "$STATUS" | grep -q '"sealed": *true'; then
        echo "Vault is sealed. Unsealing..."
        vault operator unseal "${VAULT_UNSEAL_KEY}"
      fi

      sleep 5
    done