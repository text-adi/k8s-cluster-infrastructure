apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: infrastructure
  sources:
    - repoURL: 'https://github.com/text-adi/k8s-cluster-infrastructure.git'
      targetRevision: dev
      path: infrastructure/charts/kyverno
      helm:
        releaseName: kyverno
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      managedFieldsManagers:
        - kube-controller-manager
      jsonPointers:
        - /rules
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - Replace=true