apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: 'https://github.com/text-adi/k8s-cluster-infrastructure.git'
      targetRevision: dev
      path: infrastructure/charts/tailscale-operator
    - repoURL: 'https://github.com/text-adi/k8s-cluster-infrastructure.git'
      targetRevision: dev
      path: infrastructure/manifests/tailscale-operator
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true