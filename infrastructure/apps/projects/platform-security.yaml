apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Vault, Vault Secrets Operator, cert-manager — секрети та сертифікати"
  sourceRepos:
    - 'https://github.com/text-adi/k8s-cluster-infrastructure.git'
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: vault
    - server: 'https://kubernetes.default.svc'
      namespace: vault-secrets-operator
    - server: 'https://kubernetes.default.svc'
      namespace: cert-manager
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'