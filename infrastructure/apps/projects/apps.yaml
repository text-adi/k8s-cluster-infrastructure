apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Особисті застосунки, що не є частиною платформи кластера"
  sourceRepos:
    - 'https://github.com/text-adi/k8s-cluster-app.git'
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'app-*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'